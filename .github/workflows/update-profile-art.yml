
name: Update GitHub Contribution Heatmap

on:
  schedule:
    # Run every day at 00:00 UTC
    - cron: "0 06 * * *"

  # Allows you to run it manually
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-heatmap:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # Install required packages
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      # Fetch latest GitHub contribution data
      - name: Fetch GitHub contributions
        env:
          GH_PROFILE_USER: Vivekk936
        run: |
          python scripts/fetch_contributions.py

      # Generate the contribution heatmap
      - name: Generate heatmap
        run: |
          python generate_heatmap.py

      # Commit and push updated files
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/contributions.json contrib-heatmap.svg

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update GitHub contribution heatmap"
            git push
          fi
