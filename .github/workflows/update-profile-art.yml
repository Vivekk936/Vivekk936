
name: Update GitHub Contribution Heatmap

on:
  schedule:
    # Runs every day at 00:00 UTC
    - cron: "6 06 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-heatmap:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      # 4. Fetch latest GitHub contribution data
      - name: Fetch contribution data
        env:
          GH_PROFILE_USER: Vivekk936
        run: |
          python fetch_contributions.py

      # 5. Generate heatmap SVG
      - name: Generate heatmap
        run: |
          python generate_heatmap.py

      # 6. Commit updated files
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/contributions.json contrib-heatmap.svg

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update GitHub contribution heatmap"
            git push
          fi
